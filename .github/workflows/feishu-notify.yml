name: GitHub Notify to Feishu
on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, edited, closed, reopened]
  push:
    branches: [main, master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Feishu
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.FEISHU_WEBHOOK }}
          method: 'POST'
          contentType: 'application/json'
          data: >
            {
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": {
                    "content": "GitHub 事件通知",
                    "tag": "plain_text"
                  },
                  "template": "blue"
                },
                "elements": [
                  {
                    "tag": "div",
                    "text": {
                      "tag": "lark_md",
                      "content": "**仓库**：${{ github.repository }}\n**事件**：${{ github.event_name }}\n**触发人**：[${{ github.actor }}](https://github.com/${{ github.event.compare }})\n**详情链接**：[点击查看](${{ github.event.issue.html_url || github.event.pull_request.html_url || github.event.compare }})"
                    }
                  }
                ]
              }
            }
