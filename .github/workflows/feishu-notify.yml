name: GitHub Notify to Feishu
on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, edited, closed, reopened, synchronize]
  push:
    # 所有分支的代码推送都触发通知
  create:
    # 监听创建分支/标签事件，分支过滤在 job 级别实现

jobs:
  notify:
    runs-on: ubuntu-latest
    # 只处理分支创建，自动过滤标签创建
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    steps:
      - name: 计算通知变量
        run: |
          # 1. 计算卡片主题色
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "closed" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            CARD_COLOR="green"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "closed" ]]; then
            CARD_COLOR="red"
          elif [[ "${{ github.event_name }}" == "issues" && "${{ github.event.action }}" == "closed" ]]; then
            CARD_COLOR="grey"
          elif [[ "${{ github.event_name }}" == "create" ]]; then
            CARD_COLOR="yellow"
          else
            CARD_COLOR="blue"
          fi

          # 2. 计算标题 + 额外描述
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TITLE_TEXT="${{ github.event.pull_request.title }}"
            DESC_RAW="${{ github.event.pull_request.body }}"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            TITLE_TEXT="${{ github.event.issue.title }}"
            DESC_RAW="${{ github.event.issue.body }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            # 提取第一行作为提交标题
            TITLE_TEXT=$(echo "$COMMIT_MSG" | head -n 1)
            # 提取剩余部分作为描述，去除开头空行
            DESC_RAW=$(echo "$COMMIT_MSG" | tail -n +2 | sed '/^[[:space:]]*$/d')
          else
            TITLE_TEXT="创建新分支"
            DESC_RAW=""
          fi

          # 转义描述文本，适配JSON字符串格式（换行、引号自动转义）
          DESC_TEXT=$(echo "$DESC_RAW" | sed 's/\\/\\\\/g; s/"/\\"/g; s/$/\\n/' | tr -d '\n' | sed 's/\\n$//')

          # 3. 计算分支显示文本
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_TEXT="${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}"
          elif [[ -n "${{ github.ref_name }}" ]]; then
            BRANCH_TEXT="${{ github.ref_name }}"
          else
            BRANCH_TEXT="无关联分支"
          fi

          # 4. 计算详情跳转链接
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            DETAIL_URL="${{ github.event.pull_request.html_url }}"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            DETAIL_URL="${{ github.event.issue.html_url }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            DETAIL_URL="${{ github.event.compare }}"
          else
            DETAIL_URL="https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}"
          fi

          # 5. 拼接完整卡片内容（描述为空自动隐藏）
          MARKDOWN="**仓库**：${{ github.repository }}\n**事件**：${{ github.event_name }} · ${{ github.event.action }}\n**标题**：$TITLE_TEXT"
          if [[ -n "$DESC_TEXT" ]]; then
            MARKDOWN="$MARKDOWN\n**描述**：$DESC_TEXT"
          fi
          MARKDOWN="$MARKDOWN\n**分支**：$BRANCH_TEXT\n**触发人**：[${{ github.actor }}](https://github.com/${{ github.actor }})\n**详情链接**：[点击查看]($DETAIL_URL)"

          # 写入环境变量
          echo "CARD_COLOR=$CARD_COLOR" >> $GITHUB_ENV
          echo "MARKDOWN=$MARKDOWN" >> $GITHUB_ENV

      - name: Send message to Feishu
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.FEISHU_WEBHOOK }}
          method: 'POST'
          contentType: 'application/json'
          data: >
            {
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": {
                    "content": "GitHub 事件通知",
                    "tag": "plain_text"
                  },
                  "template": "${{ env.CARD_COLOR }}"
                },
                "elements": [
                  {
                    "tag": "div",
                    "text": {
                      "tag": "lark_md",
                      "content": "${{ env.MARKDOWN }}"
                    }
                  }
                ]
              }
            }
